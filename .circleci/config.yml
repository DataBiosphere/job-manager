# CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/configuration-reference/ for more details
#
version: 2.1

executors:
  ubuntu:
    machine:
      # latest pinned 24.04 version https://circleci.com/developer/machine/image/ubuntu-2404
      image: ubuntu-2404:2024.11.1
    working_directory: ~/job-manager

commands:
  setup_env:
    description: Setup Environment Variables
    steps:
      - run:
          name: Setup Environment Variables
          command: |
            echo 'export PATH="${PATH}:${HOME}/job-manager/git-secrets"' >> $BASH_ENV

  setup_git_secrets:
    description: Install git secrets and configure minnie-kenny.sh
    steps:
      - run:
          name: Install git secrets and configure minnie-kenny.sh
          command: |
            git clone https://github.com/awslabs/git-secrets.git
            pushd git-secrets >/dev/null

            # 2024-12-09 updated to a new version of git-secrets, the old one
            # relied `say` command which is unavailable in new CircleCI base image
            # https://github.com/awslabs/git-secrets/issues/220
            git checkout 5357e18bc27b42a827b6780564ea873a72ca1f01

            popd >/dev/null
            ./minnie-kenny.sh -f

  checkout_and_setup:
    description: Check out the code, set up the environment and install git secrets
    steps:
      - checkout
      - setup_env
      - setup_git_secrets

  ui_yarn:
    description: Run a yarn command in ui/ with Node 22 loaded through nvm
    parameters:
      step_name:
        type: string
      yarn_command:
        type: string
    steps:
      - run:
          name: << parameters.step_name >>
          command: |
            cd ui
            # nvm setup commands and Node install reprised
            export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" # This loads nvm
            nvm install 22
            corepack enable
            yarn << parameters.yarn_command >>

jobs:
  ui:
    executor: ubuntu
    steps:
      - checkout_and_setup
      - restore_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "ui/package.json" }}--{{ checksum "ui/yarn.lock" }}
      - run:
          name: nvm install node and UI dependencies
          # The Circle Ubuntu machine images of yore apparently came with nvm installed, but the current images require
          # us to install it ourselves.
          command: |
            # Install curl
            apt update && apt -y upgrade && apt -y install curl

            # Use curl to download nvm and run its installer
            curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.1/install.sh | bash

            # nvm setup commands
            export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Angular 20 requires Node >=20.19.0
            nvm install 22

            # Enable corepack so yarn Berry (3.x) works correctly
            corepack enable

            cd ui
            yarn install --immutable
      - save_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "ui/package.json" }}--{{ checksum "ui/yarn.lock" }}
          paths:
            - "ui/node_modules"
      - run:
          name: Rebuild swagger
          command: |
            /bin/bash ./scripts/rebuild_swagger.sh
      - ui_yarn:
          step_name: Lint angular code with eslint
          yarn_command: eslint
      - ui_yarn:
          step_name: Type check with tsc
          yarn_command: tsc
      - ui_yarn:
          step_name: Run UI unit tests
          yarn_command: ng test --watch=false --source-map=false --browsers=ChromeHeadless
      # Target production to emulate deployment, but a dev environment
      # because we do not have a prod environment file.
      # https://github.com/angular/angular-cli/wiki/build#--dev-vs---prod-builds
      - ui_yarn:
          step_name: Ensure the UI builds for prod
          yarn_command: ng build --configuration=production

  backends:
    executor: ubuntu
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /home/circleci/gcloud-service-key.json
    steps:
      - checkout_and_setup
      - restore_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "servers/cromwell/requirements.txt" }}
      - restore_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "servers/jm_utils/requirements.txt" }}
      - run:
          name: Rebuild swagger
          command: |
            /bin/bash ./scripts/rebuild_swagger.sh
      - run:
          name: Check version
          command: |
            python3 --version
            which python3
      - run:
          name: Install Python 3.10
          command: |
            pyenv install 3.10
            pyenv global 3.10
      - run:
          name: Install tox and yapf
          # tox (and detox) fail with older versions of more-itertools: https://github.com/pytest-dev/pytest/issues/4770
          command: |
            pip3 install --upgrade pip
            pip3 install tox>=3.26.0 pytest>=4.6.5 yapf
      - run:
          name: Lint python code with yapf
          command: |
            sh ./scripts/yapf_lint.sh
      - run:
          name: Run cromwell server tests
          command: |
            tox -c ./servers/cromwell
      - run:
          name: Run jm_utils server tests
          command: |
            tox -c ./servers/jm_utils
      - save_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "servers/cromwell/requirements.txt" }}
          paths:
            - "servers/cromwell/.tox"
      - save_cache:
          key: node-modules-{{ .Branch }}--{{ checksum "servers/jm_utils/requirements.txt" }}
          paths:
            - "servers/jm_utils/.tox"

  secrets:
    executor: ubuntu
    steps:
      - checkout_and_setup
      - run:
          name: Check for git secrets
          command: |
            git secrets --scan-history

workflows:
  ui_and_backends_and_secrets:
    jobs:
      - ui
      - backends
      - secrets
